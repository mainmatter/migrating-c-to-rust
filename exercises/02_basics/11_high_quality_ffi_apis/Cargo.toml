[package]
name = "bm_high_quality_ffi_apis"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints.rust]
# `undocumented_unsafe_blocks` below only fires on *explicit* `unsafe {}`
# blocks. Edition 2024 only warns on unsafe ops in an `unsafe fn` body, so a
# solution could ignore the warning, write no explicit blocks, need no
# `// SAFETY:` comments at all, and the lint below would never fire. Deny it.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# The section is about per-block `// SAFETY:` comments, which `missing_safety_doc`
# does not cover. This lint is what actually checks them.
undocumented_unsafe_blocks = "warn"
